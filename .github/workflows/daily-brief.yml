name: Daily store-coach briefs

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 05:30 IST, every morning without anyone asking
  workflow_dispatch: {}

permissions:
  contents: read   # generation only; no run ever writes to this repo

jobs:
  briefs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate all manager briefs and salesperson actions
        run: node generate_briefs.js
      - name: Publish generated briefs and weekly state as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-coach-briefs
          path: |
            generated/
            state/
          retention-days: 30
# Hackathon event rule 5: no commits or pushes after the 4:45 pm lock. This
# workflow therefore has no git write step on ANY run - scheduled or manual -
# so no future fire can push after the deadline. The generated/ and state/
# folders committed in this repo are the pre-lock verification outputs
# (manual dispatches #1 and #2 on 21 Nov 2026, before the lock).
